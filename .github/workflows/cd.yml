name: Deploy Entregador

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout commit validado pelo CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/delivery-entregador:${{ github.event.workflow_run.head_sha }}

      - name: Deploy to AWS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

        with:
          host: ${{ secrets.HOST_TEST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST }}
          port: 22
          envs: DATABASE_URL,DOCKERHUB_USERNAME,IMAGE_TAG

          script: |
            docker pull $DOCKERHUB_USERNAME/delivery-entregador:$IMAGE_TAG

            docker run --rm \
              --network delivery-network \
              -e DATABASE_URL="$DATABASE_URL" \
              $DOCKERHUB_USERNAME/delivery-entregador:$IMAGE_TAG \
              alembic upgrade head

            docker stop delivery-entregador || true
            docker rm delivery-entregador || true

            docker run -d \
              --name delivery-entregador \
              --restart unless-stopped \
              --network delivery-network \
              -p 8081:8000 \
              -e DATABASE_URL="$DATABASE_URL" \
              $DOCKERHUB_USERNAME/delivery-entregador:$IMAGE_TAG